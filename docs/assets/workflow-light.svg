<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <rect width="1200" height="220" rx="24" fill="#f7f4ee"/>
  <!-- Box 1: Upstream LLM -->
  <rect x="28" y="34" width="250" height="152" rx="20" fill="#fcfaf6" stroke="#ded8cc" stroke-width="1.5"/>
  <text x="48" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#284b37">1. Any Model / Harness</text>
  <text x="48" y="98" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#4f4a42">• DeepSeek / OpenAI</text>
  <text x="48" y="122" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#4f4a42">• Claude / Gemini</text>
  <text x="48" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#4f4a42">• Local Gemma / DSH</text>

  <!-- Arrow 1 -->
  <line x1="286" y1="110" x2="326" y2="110" stroke="#7d766b" stroke-width="2"/>
  <polygon points="324,104 334,110 324,116" fill="#7d766b"/>

  <!-- Box 2: chat-human + Protocol -->
  <rect x="342" y="34" width="286" height="152" rx="20" fill="#e5efe8" stroke="#c3dacb" stroke-width="1.5"/>
  <text x="364" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1e3f2d">2. nb-speak Core &amp; Bridge</text>
  <text x="364" y="98" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#234432">• send_message(bubbles[])</text>
  <text x="364" y="122" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#234432">• send_artifact(code/table)</text>
  <text x="364" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#234432">• Plain-reply fallback</text>
  <text x="364" y="168" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#284b37">• Subagent tool remap</text>

  <!-- Arrow 2 -->
  <line x1="636" y1="110" x2="676" y2="110" stroke="#7d766b" stroke-width="2"/>
  <polygon points="674,104 684,110 674,116" fill="#7d766b"/>

  <!-- Box 3: Deterministic Gate -->
  <rect x="692" y="34" width="210" height="152" rx="20" fill="#fcfaf6" stroke="#ded8cc" stroke-width="1.5"/>
  <text x="712" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#284b37">3. bubble_lint Gate</text>
  <text x="712" y="98" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#4f4a42">• Zero Markdown walls</text>
  <text x="712" y="122" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#4f4a42">• Zero *sighs* / clichés</text>
  <text x="712" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#4f4a42">• Voice overlap &lt; 50%</text>

  <!-- Arrow 3 -->
  <line x1="910" y1="110" x2="950" y2="110" stroke="#7d766b" stroke-width="2"/>
  <polygon points="948,104 958,110 948,116" fill="#7d766b"/>

  <!-- Box 4: Human IM Surface -->
  <rect x="966" y="34" width="206" height="152" rx="20" fill="#284b37"/>
  <text x="986" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#faf8f4">4. Human IM Delivery</text>
  <text x="986" y="98" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#dcebe1">• Paced SSE bubbles</text>
  <text x="986" y="122" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#dcebe1">• Slide-out cards</text>
  <text x="986" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#dcebe1">• nb-im / Web / DSH</text>
</svg>

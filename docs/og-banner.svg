<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#221e18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Warm Paper-Ink Canvas -->
  <rect width="1280" height="640" fill="#f7f4ee"/>

  <!-- Subtle architectural dot-margin accent -->
  <rect x="56" y="48" width="136" height="32" rx="16" fill="#e5efe8"/>
  <text x="124" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#234432">NB-Corp · v0.2</text>

  <!-- Left Title Column -->
  <text x="56" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.6" fill="#1d1b18">nb-speak</text>
  <text x="56" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21.5" font-weight="700" fill="#284b37">How AI agents actually speak to humans.</text>

  <text x="56" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16.5" fill="#57524a">Universal send_message + send_artifact protocol,</text>
  <text x="56" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16.5" fill="#57524a">OpenAI/SSE bridge, DSH plugin &amp; chat-human Skill.</text>

  <!-- 3 Metric / Feature Pills -->
  <rect x="56" y="334" width="388" height="52" rx="16" fill="#ffffff" stroke="#e4dfd5" stroke-width="1.5"/>
  <circle cx="84" cy="360" r="6" fill="#284b37"/>
  <text x="102" y="366" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" fill="#1d1b18">send_message({ bubbles, voice_note })</text>

  <rect x="56" y="398" width="388" height="52" rx="16" fill="#ffffff" stroke="#e4dfd5" stroke-width="1.5"/>
  <circle cx="84" cy="424" r="6" fill="#284b37"/>
  <text x="102" y="430" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" fill="#1d1b18">send_artifact({ title, kind, content })</text>

  <rect x="56" y="462" width="388" height="52" rx="16" fill="#e5efe8" stroke="#c7dccf" stroke-width="1.5"/>
  <text x="80" y="494" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" fill="#20412f">bubble_lint: 0 warnings · 97.2%–100% pass</text>

  <text x="56" y="576" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#655f56">npx skills add NB-Corp/nb-speak</text>

  <!-- Right Concentric M12 Split Stage Preview -->
  <rect x="492" y="52" width="732" height="536" rx="32" fill="#ece7dd" stroke="#dcd5c8" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="502" y="62" width="712" height="516" rx="24" fill="#fcfaf6" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Divider inside Split Card -->
  <line x1="816" y1="62" x2="816" y2="578" stroke="#e7e1d6" stroke-width="1.5"/>

  <!-- Pane 1: Raw LLM Wall -->
  <text x="528" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6b645b">Raw assistant.content</text>
  <rect x="698" y="84" width="96" height="24" rx="12" fill="#f9e6e2"/>
  <text x="746" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#8d2d1e">4 lint issues</text>

  <rect x="526" y="126" width="268" height="392" rx="18" fill="#f5f1e9" stroke="#e6cfc9" stroke-width="1.2"/>
  <text x="544" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#3a352f">### Canary Assessment Report</text>
  <text x="544" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5e584f">I am reporting back to you! Based</text>
  <text x="544" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5e584f">on the 25-minute slice, note that:</text>
  <text x="544" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5e584f">1. Traffic Coverage: 5x load may</text>
  <text x="544" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5e584f">   saturate DB connection pools.</text>
  <text x="544" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5e584f">2. Stage Gate: Push 50% first and</text>
  <text x="544" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5e584f">   watch lock wait queues closely.</text>
  <rect x="544" y="306" width="232" height="94" rx="10" fill="#ebe5da"/>
  <text x="556" y="330" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#4f4a42">| Metric | Canary | SLA   |</text>
  <text x="556" y="350" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#4f4a42">| Err    | 0.02%  | 0.10% |</text>
  <text x="556" y="370" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#4f4a42">| p99    | 38ms   | 80ms  |</text>
  <text x="544" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8d2d1e">*sighs* Hope this helps! Go eat</text>
  <text x="544" y="451" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8d2d1e">something warm and get rest!</text>
  <text x="544" y="496" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8d2d1e">× markdown_structure · steward_cliche</text>

  <!-- Pane 2: nb-speak Paced Bubbles + Artifact + Voice Note -->
  <text x="842" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1d1b18">nb-speak Protocol</text>
  <rect x="1084" y="84" width="106" height="24" rx="12" fill="#e5efe8"/>
  <text x="1137" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#20412f">0 warnings</text>

  <!-- User prompt bubble -->
  <rect x="920" y="126" width="270" height="44" rx="18" fill="#284b37"/>
  <text x="938" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#faf8f4">20% canary hit 25m. Push 100%?</text>

  <!-- Agent Bubble 1 -->
  <rect x="842" y="188" width="292" height="44" rx="18" fill="#f2ede4" stroke="#e2dcd0" stroke-width="1"/>
  <text x="860" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#1d1b18">Error rate held at 0.02%, p99 at 38ms</text>

  <!-- Agent Bubble 2 -->
  <rect x="842" y="242" width="308" height="44" rx="18" fill="#f2ede4" stroke="#e2dcd0" stroke-width="1"/>
  <text x="860" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#1d1b18">Pool looks steady too, good to push 100%</text>

  <!-- Slide-out Artifact Card -->
  <rect x="842" y="302" width="348" height="122" rx="18" fill="#faf8f3" stroke="#d8d0c2" stroke-width="1.2"/>
  <rect x="842" y="302" width="348" height="34" rx="18" fill="#ece7dd"/>
  <text x="860" y="324" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#2b2823">auth-canary-25m.sql</text>
  <text x="1120" y="324" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#655f56">artifact</text>
  <text x="860" y="362" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#284b37">SELECT status, p99_ms, pool_wait</text>
  <text x="860" y="384" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#2b2823">FROM canary_rollup WHERE slice='20%';</text>
  <text x="860" y="406" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#6c665d">-- 0 lock waits · PASS</text>

  <!-- Complementary Voice-Note Waveform Pill -->
  <rect x="842" y="442" width="256" height="42" rx="21" fill="#e5efe8" stroke="#c3dacb" stroke-width="1.2"/>
  <circle cx="864" cy="463" r="14" fill="#284b37"/>
  <polygon points="861,457 861,469 871,463" fill="#faf8f4"/>
  <!-- Waveform bars -->
  <rect x="890" y="456" width="3.5" height="14" rx="1.7" fill="#284b37"/>
  <rect x="898" y="451" width="3.5" height="24" rx="1.7" fill="#284b37"/>
  <rect x="906" y="454" width="3.5" height="18" rx="1.7" fill="#284b37"/>
  <rect x="914" y="449" width="3.5" height="28" rx="1.7" fill="#284b37"/>
  <rect x="922" y="455" width="3.5" height="16" rx="1.7" fill="#284b37"/>
  <rect x="930" y="452" width="3.5" height="22" rx="1.7" fill="#284b37"/>
  <rect x="938" y="457" width="3.5" height="12" rx="1.7" fill="#284b37"/>
  <rect x="946" y="453" width="3.5" height="20" rx="1.7" fill="#284b37"/>
  <text x="964" y="468" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#20412f">6s · calm aside</text>

  <text x="846" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#57524a">“Dashboard stayed quiet for twenty-five minutes</text>
  <text x="846" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#57524a"> straight. Flip it whenever you are ready.”</text>
</svg>

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-nb-speak"
version = "0.2.0"
description = "Stop NoneBot2 chatbots from dumping raw Markdown pipe tables and 250-word essays: paced IM bubbles & mobile key-value/code cards across all adapters."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Nai Long 7th", email = "nailong@xter.org" }
]
requires-python = ">=3.10"
dependencies = [
  "nonebot2>=2.2.0",
  "pydantic>=2.0.0",
]
keywords = [
  "nonebot",
  "nonebot2",
  "chatbot",
  "onebot",
  "telegram",
  "nb-speak",
  "chat-human",
  "markdown-tables",
]
classifiers = [
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/NB-Corp/nb-speak"
Repository = "https://github.com/NB-Corp/nb-speak/tree/main/integrations/nonebot_plugin_nb_speak"
Issues = "https://github.com/NB-Corp/nb-speak/issues"

[tool.setuptools.packages.find]
include = ["nonebot_plugin_nb_speak*"]

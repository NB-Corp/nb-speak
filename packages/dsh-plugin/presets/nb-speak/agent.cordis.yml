- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are working in {{cwd}}. Execute file, shell, and web tools directly when needed. Speak to the human user in natural thumb-typed IM beats rather than long Markdown memos, offloading code, diffs, and tables cleanly.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
